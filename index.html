<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Shawarma Boss POS</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e60000">
  <link rel="icon" href="icons/logo.png">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <script src="https://kit.fontawesome.com/a2d9d6f0d8.js" crossorigin="anonymous"></script>

  <!-- QR library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-white text-black min-h-screen">

  <!-- Header -->
  <header class="bg-black text-white p-3 shadow">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="icons/logo.png" width="48" height="48" alt="logo" class="rounded"/>
        <div>
          <h1 class="h5 mb-0 text-danger">Shawarma Boss</h1>
          <small class="text-white-50">Offline POS</small>
        </div>
      </div>
      <div id="headerControls" class="text-end"></div>
    </div>
  </header>

  <main class="container py-4">

    <!-- Login -->
    <section id="loginScreen" class="mx-auto" style="max-width:420px;">
      <div class="card shadow-lg">
        <div class="card-body p-4">
          <div class="text-center mb-3">
            <img src="icons/logo.png" width="76" alt="logo" class="mb-2"/>
            <h2 class="h4 text-danger">Shawarma Boss POS</h2>
          </div>

          <div class="mb-2">
            <label class="form-label small">Username</label>
            <input id="loginUsername" class="form-control" type="text" placeholder="Username" />
          </div>
          <div class="mb-3">
            <label class="form-label small">Password</label>
            <input id="loginPassword" class="form-control" type="password" placeholder="Password" />
          </div>
          <div class="d-grid">
            <button id="loginBtn" class="btn btn-danger">Login</button>
          </div>
          <div id="loginErr" class="text-danger small mt-2 d-none">Invalid credentials</div>
        </div>
      </div>
    </section>

    <!-- App -->
    <section id="appRoot" class="d-none">
      <div class="row g-3">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-body">
              <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 class="h5 mb-0 text-danger">New Order</h3>
                <div>
                  <button id="clearCartBtn" class="btn btn-outline-secondary btn-sm me-2">Clear Cart</button>
                  <button id="confirmOrderBtn" class="btn btn-success btn-sm">Confirm Order</button>
                </div>
              </div>
              <div id="menuGrid" class="row g-3"></div>
            </div>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="card mb-3">
            <div class="card-body">
              <h4 class="h6 text-danger">Cart</h4>
              <div id="cartList" class="mt-2"></div>
              <div class="mt-3 border-top pt-2 d-flex justify-content-between">
                <div class="small text-muted">Total</div>
                <div id="cartTotal" class="fw-bold">GHS 0.00</div>
              </div>
            </div>
          </div>
          <div class="card">
            <div class="card-body">
              <h4 class="h6 text-danger">Quick Sales</h4>
              <div id="recentSales" class="mt-2 small text-muted"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin -->
      <div id="adminPanel" class="card mt-4 d-none">
        <div class="card-body">
          <h3 class="h5 text-danger">Admin Panel</h3>
          <div class="row g-3 mt-3">
            <div class="col-md-4">
              <div class="p-3 border rounded">
                <h6 class="mb-2">Staff</h6>
                <div id="staffList" class="mb-2"></div>
                <div class="d-flex gap-2">
                  <input id="newStaffUser" class="form-control form-control-sm" placeholder="username" />
                  <input id="newStaffPass" class="form-control form-control-sm" placeholder="password" />
                  <button id="addStaffBtn" class="btn btn-sm btn-danger">Add</button>
                </div>
                <div class="mt-2">
                  <button id="resetUsersBtn" class="btn btn-outline-danger btn-sm">Reset Users</button>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-3 border rounded">
                <h6 class="mb-2">Menu Management</h6>
                <div id="menuManage" class="mb-2"></div>
                <div class="d-flex gap-2">
                  <input id="newItemName" class="form-control form-control-sm" placeholder="Item name" />
                  <input id="newItemPrice" class="form-control form-control-sm" placeholder="price" />
                  <input id="newItemStock" class="form-control form-control-sm" placeholder="stock" />
                  <button id="addItemBtn" class="btn btn-sm btn-danger">Add</button>
                </div>
              </div>
            </div>

            <div class="col-md-4">
              <div class="p-3 border rounded">
                <h6 class="mb-2">Backup & Export</h6>
                <div class="d-grid gap-2">
                  <button id="exportJsonBtn" class="btn btn-sm btn-outline-primary">Export JSON</button>
                  <input id="importJsonFile" type="file" accept="application/json" class="form-control form-control-sm"/>
                  <button id="exportCsvBtn" class="btn btn-sm btn-outline-success">Export CSV</button>
                </div>
                <hr/>
                <h6 class="mb-1">Stock Alerts</h6>
                <div id="stockAlerts" class="small text-danger"></div>
              </div>
            </div>
          </div>

          <hr class="my-3" />
          <h6 class="mb-2">Sales Report</h6>
          <div class="d-flex gap-2 align-items-center mb-3">
            <select id="salesFilter" class="form-select form-select-sm w-auto">
              <option value="all">All staff</option>
            </select>
            <button id="refreshSalesBtn" class="btn btn-sm btn-outline-secondary">Refresh</button>
            <button id="printChartBtn" class="btn btn-sm btn-outline-dark">Print Chart</button>
          </div>
          <div id="salesReport"></div>
          <div class="mt-3" style="height:220px;">
            <canvas id="salesChart"></canvas>
          </div>
        </div>
      </div>
    </section>

  </main>

  <footer class="text-center text-muted py-3 small">Shawarma Boss • Offline PWA</footer>

  <!-- Receipt Modal -->
  <div class="modal fade" id="receiptModal" tabindex="-1">
    <div class="modal-dialog modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title text-danger">Receipt</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="receiptBody"></div>
        <div class="modal-footer">
          <button class="btn btn-danger" onclick="window.print()">Print</button>
          <button class="btn btn-outline-danger" onclick="downloadPDF()">Download PDF</button>
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Template -->
  <template id="menuCardTpl">
    <div class="col-sm-6 col-md-4">
      <div class="card menu-card h-100">
        <div class="card-body d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start">
            <h5 class="card-title item-name"></h5>
            <div class="badge bg-danger item-price-badge"></div>
          </div>
          <div class="text-muted small item-stock mt-2"></div>
          <div class="mt-auto d-flex gap-2 align-items-center">
            <input type="number" min="1" value="1" class="form-control qty-input" style="width:80px;" />
            <button class="btn btn-danger add-to-cart btn-sm">Add</button>
          </div>
        </div>
      </div>
    </div>
  </template>

  <!-- Service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('service-worker.js').catch(console.error);
    }
  </script>
  <script src="app.js" defer></script>
</body>
</html>
